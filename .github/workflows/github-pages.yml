# Bản xem thử tĩnh trên GitHub Pages: mỗi lần push lên nhánh main là tự build và cập nhật.
# Bật một lần: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Bản xem thử (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Lấy địa chỉ trang
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # GitHub Pages chỉ phục vụ file tĩnh, không chạy được API Node.js.
      # Xoá API trong bản build này thôi; code trên repo vẫn giữ nguyên cho bản VPS.
      - name: Bỏ API form khỏi bản tĩnh
        run: rm -rf app/api

      - name: Build trang tĩnh
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Tuỳ chọn: để form gửi thật, đặt biến repo FORM_ENDPOINT (Settings → Secrets and variables → Actions → Variables).
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Đăng lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
